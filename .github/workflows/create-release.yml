name: Create Release from CLI Build

on:
  push:
    branches:
      - 'cli-release-*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloads repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          VERSION=${BRANCH_NAME#cli-release-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Read release info
        id: release-info
        run: |
          if [ -f "releases/cli/${{ steps.version.outputs.version }}/release-info.json" ]; then
            NOTES=$(jq -r '.notes' releases/cli/${{ steps.version.outputs.version }}/release-info.json)
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=Release ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cli-v${{ steps.version.outputs.version }}
          name: WeaverBird CLI v${{ steps.version.outputs.version }}
          body: ${{ steps.release-info.outputs.notes }}
          files: |
            releases/cli/${{ steps.version.outputs.version }}/*.tar.gz
            releases/cli/${{ steps.version.outputs.version }}/*.sha256
            releases/cli/${{ steps.version.outputs.version }}/*.deb
            releases/cli/${{ steps.version.outputs.version }}/*.snap
          draft: false
          prerelease: false

      - name: Update latest.json on master
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.release-info.outputs.notes }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          # Get files list from current release branch (before switching to master)
          FILES_JSON=$(cd releases/cli/${VERSION} && ls -1 | grep -v release-info.json | jq -R . | jq -s .)

          # Fetch and checkout master
          git fetch origin master
          git checkout master

          # Create latest.json from release info
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "cli-v${VERSION}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": $(echo "$NOTES" | jq -Rs .),
            "files": ${FILES_JSON},
            "downloadUrl": "https://github.com/weaverbird-io/downloads/releases/download/cli-v${VERSION}"
          }
          EOF

          # Commit to master
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest.json for v${VERSION}"
          git push origin master

      - name: Delete release branch
        run: |
          git push origin --delete ${GITHUB_REF#refs/heads/}
