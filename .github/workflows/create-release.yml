name: Create Release from CLI Build

on:
  push:
    branches:
      - 'cli-release-*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloads repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          VERSION=${BRANCH_NAME#cli-release-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Read release info
        id: release-info
        run: |
          if [ -f "releases/cli/${{ steps.version.outputs.version }}/release-info.json" ]; then
            NOTES=$(jq -r '.notes' releases/cli/${{ steps.version.outputs.version }}/release-info.json)
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=Release ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cli-v${{ steps.version.outputs.version }}
          name: WeaverBird CLI v${{ steps.version.outputs.version }}
          body: ${{ steps.release-info.outputs.notes }}
          files: |
            releases/cli/${{ steps.version.outputs.version }}/*.tar.gz
            releases/cli/${{ steps.version.outputs.version }}/*.sha256
            releases/cli/${{ steps.version.outputs.version }}/*.deb
            releases/cli/${{ steps.version.outputs.version }}/*.snap
          draft: false
          prerelease: false

      - name: Update latest.json on master
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.release-info.outputs.notes }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          # Get files list from current release branch (before switching to master)
          FILES_JSON=$(cd releases/cli/${VERSION} && ls -1 | grep -v release-info.json | jq -R . | jq -s .)

          # Fetch and checkout master
          git fetch origin master
          git checkout master

          # Read existing latest.json (or create empty structure if doesn't exist)
          if [ -f latest.json ]; then
            EXISTING_JSON=$(cat latest.json)
          else
            EXISTING_JSON='{"products":{}}'
          fi

          # Update the weaverbird-cli product in the existing JSON
          UPDATED_JSON=$(echo "$EXISTING_JSON" | jq \
            --arg version "${VERSION}" \
            --arg tag "cli-v${VERSION}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$NOTES" \
            --argjson files "${FILES_JSON}" \
            --arg downloadUrl "https://github.com/weaverbird-io/downloads/releases/download/cli-v${VERSION}" \
            '.products["weaverbird-cli"] = {
              version: $version,
              tag: $tag,
              date: $date,
              notes: $notes,
              files: $files,
              downloadUrl: $downloadUrl
            }')

          # Write updated JSON back to latest.json
          echo "$UPDATED_JSON" > latest.json

          # Commit to master
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest.json for weaverbird-cli v${VERSION}"
          git push origin master

      - name: Update APT repository
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          echo "Updating APT repository on gh-pages branch..."

          # Copy .deb files from release branch before switching branches
          echo "Copying .deb files from release branch..."
          mkdir -p /tmp/debs
          cp releases/cli/${VERSION}/*.deb /tmp/debs/ || {
            echo "ERROR: No .deb files found in releases/cli/${VERSION}/"
            exit 1
          }
          DEB_COUNT=$(ls -1 /tmp/debs/*.deb 2>/dev/null | wc -l)
          echo "Found $DEB_COUNT .deb files"
          ls -lh /tmp/debs/

          # Fetch gh-pages branch
          git fetch origin gh-pages
          git checkout gh-pages

          # Install dpkg-dev for dpkg-scanpackages
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev

          # Create APT directory structure
          mkdir -p apt/pool
          mkdir -p apt/dists/stable/main/binary-amd64
          mkdir -p apt/dists/stable/main/binary-arm64

          # Copy .deb files to APT pool
          echo "Adding .deb files to APT repository..."
          cp /tmp/debs/*.deb apt/pool/
          ls -lh apt/pool/

          # Generate Packages files for each architecture
          echo "Generating Packages files..."
          (cd apt && dpkg-scanpackages --arch amd64 pool/ /dev/null > dists/stable/main/binary-amd64/Packages)
          (cd apt && dpkg-scanpackages --arch arm64 pool/ /dev/null > dists/stable/main/binary-arm64/Packages)

          # Compress Packages files
          gzip -9 -k -f apt/dists/stable/main/binary-amd64/Packages
          gzip -9 -k -f apt/dists/stable/main/binary-arm64/Packages

          # Generate Release file
          cat > apt/dists/stable/Release <<EOF
          Origin: WeaverBird
          Label: WeaverBird APT Repository
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: WeaverBird CLI and tools
          Date: $(date -R -u)
          EOF

          # Add file checksums to Release
          (cd apt/dists/stable && {
              echo "MD5Sum:"
              find main -type f 2>/dev/null | while read f; do
                  size=$(stat -c%s "$f")
                  md5=$(md5sum "$f" | awk '{print $1}')
                  printf " %s %16d %s\n" "$md5" "$size" "$f"
              done
              echo "SHA1:"
              find main -type f 2>/dev/null | while read f; do
                  size=$(stat -c%s "$f")
                  sha1=$(sha1sum "$f" | awk '{print $1}')
                  printf " %s %16d %s\n" "$sha1" "$size" "$f"
              done
              echo "SHA256:"
              find main -type f 2>/dev/null | while read f; do
                  size=$(stat -c%s "$f")
                  sha256=$(sha256sum "$f" | awk '{print $1}')
                  printf " %s %16d %s\n" "$sha256" "$size" "$f"
              done
          }) >> apt/dists/stable/Release

          # Copy Release to InRelease (unsigned for now)
          cp apt/dists/stable/Release apt/dists/stable/InRelease

          # Create/update README for APT repo
          cat > apt/README.md <<'APTREADME'
          # WeaverBird APT Repository

          Official APT repository for WeaverBird CLI and tools.

          ## Quick Install

          ```bash
          # Add repository
          echo "deb [trusted=yes] https://weaverbird-io.github.io/downloads/apt stable main" | sudo tee /etc/apt/sources.list.d/weaverbird.list

          # Update and install
          sudo apt update
          sudo apt install weaverbird
          ```

          **Note:** Using `[trusted=yes]` as repository is not yet GPG-signed. GPG signing coming soon.

          ## Auto-Updates

          Once installed, receive updates automatically:

          ```bash
          sudo apt update && sudo apt upgrade
          ```

          ## Available Packages

          - **weaverbird** - WeaverBird CLI Agent for server management

          ## Supported Architectures

          - amd64 (x86_64)
          - arm64 (aarch64)

          ---

          Visit https://weaverbird.io for more information.
          APTREADME

          # Commit and push to gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apt/

          if git diff --staged --quiet; then
            echo "No changes to APT repository"
          else
            git commit -m "Update APT repository for weaverbird-cli v${VERSION}

          - Updated repository metadata
          - Added/updated .deb packages

          Repository contains all weaverbird-cli releases.
          Access at: https://weaverbird-io.github.io/downloads/apt"

            git push origin gh-pages
            echo "✅ APT repository updated successfully"
          fi

          # Switch back to release branch for cleanup
          git checkout ${GITHUB_REF#refs/heads/}

      - name: Delete release branch
        run: |
          git push origin --delete ${GITHUB_REF#refs/heads/}
