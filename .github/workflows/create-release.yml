name: Create Release from CLI Build

on:
  push:
    branches:
      - 'cli-release-*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloads repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          VERSION=${BRANCH_NAME#cli-release-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Read release info
        id: release-info
        run: |
          if [ -f "releases/cli/${{ steps.version.outputs.version }}/release-info.json" ]; then
            NOTES=$(jq -r '.notes' releases/cli/${{ steps.version.outputs.version }}/release-info.json)
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=Release ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cli-v${{ steps.version.outputs.version }}
          name: WeaverBird CLI v${{ steps.version.outputs.version }}
          body: ${{ steps.release-info.outputs.notes }}
          files: |
            releases/cli/${{ steps.version.outputs.version }}/*.tar.gz
            releases/cli/${{ steps.version.outputs.version }}/*.sha256
            releases/cli/${{ steps.version.outputs.version }}/*.deb
            releases/cli/${{ steps.version.outputs.version }}/*.snap
          draft: false
          prerelease: false

      - name: Merge latest.json to master
        run: |
          # Fetch and checkout master
          git fetch origin master
          git checkout master

          # Copy latest.json from release branch
          git checkout ${GITHUB_REF#refs/heads/} -- latest.json

          # Commit to master
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest.json for v${{ steps.version.outputs.version }}"
          git push origin master

      - name: Delete release branch
        run: |
          git push origin --delete ${GITHUB_REF#refs/heads/}
